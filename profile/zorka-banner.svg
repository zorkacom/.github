<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zorka organization banner</title>
  <desc id="desc">Zorka GitHub organization banner with the updated Zorka logo and a layout optimized for GitHub profile rendering.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="112" y1="36" x2="1512" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111E"/>
      <stop offset="0.5" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <radialGradient id="banner-violet-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 202) rotate(22.8) scale(296 208)">
      <stop offset="0" stop-color="#863BFF" stop-opacity="0.48"/>
      <stop offset="0.52" stop-color="#863BFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#863BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-teal-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1122 118) rotate(10) scale(246 128)">
      <stop offset="0" stop-color="#46B69F" stop-opacity="0.24"/>
      <stop offset="0.65" stop-color="#47BFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#47BFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner-rule" x1="0" y1="0" x2="444" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C89BFF"/>
      <stop offset="0.45" stop-color="#863BFF"/>
      <stop offset="1" stop-color="#46B69F"/>
    </linearGradient>
    <linearGradient id="banner-chip-stroke" x1="0" y1="0" x2="228" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C89BFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#46B69F" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="banner-grid" x1="942" y1="0" x2="1486" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8EA1BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8EA1BF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8EA1BF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1598" height="418" rx="28" fill="url(#banner-bg)"/>
  <rect x="1" y="1" width="1598" height="418" rx="28" stroke="#17253B"/>

  <ellipse cx="274" cy="204" rx="304" ry="214" fill="url(#banner-violet-glow)"/>
  <ellipse cx="1120" cy="118" rx="256" ry="138" fill="url(#banner-teal-glow)"/>

  <g opacity="0.42">
    <path d="M942 82H1488" stroke="url(#banner-grid)" stroke-width="1"/>
    <path d="M894 210H1522" stroke="url(#banner-grid)" stroke-width="1"/>
    <path d="M948 338H1480" stroke="url(#banner-grid)" stroke-width="1"/>
    <path d="M1224 54V366" stroke="#152137" stroke-width="1"/>
  </g>

  <path d="M520 78V344" stroke="#17253B" stroke-width="1.2"/>

  <g transform="translate(98 70)">
    <g transform="translate(14 6) scale(5.2)">
      <path d="M8.5 9.5H39.5L8.5 38.5H39.5" stroke="#7E14FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="13.4" cy="15" r="3.3" fill="#FFFFFF"/>
      <path d="M13.4 15H29.6L23.9 21.1H27.2L19.6 29.2H23.2L18.2 34H34.6" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34.6" cy="34" r="3.3" fill="#FFFFFF"/>
    </g>
    <text x="34" y="324" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="8">ZORKA</text>
  </g>

  <g transform="translate(590 52)">
    <text x="0" y="74" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.4" textLength="760" lengthAdjust="spacingAndGlyphs">Your business rules.</text>
    <text x="0" y="138" fill="#C89BFF" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.4" textLength="824" lengthAdjust="spacingAndGlyphs">Running where decisions happen.</text>
    <text x="2" y="184" fill="#8EA1BF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" textLength="818" lengthAdjust="spacingAndGlyphs">RUNS IN YOUR CLOUD / FULL RUNTIME SPEED / PII + PIFI STAY IN YOUR ENVIRONMENT</text>
    <path d="M0 220H444" stroke="url(#banner-rule)" stroke-width="2"/>
    <text x="0" y="266" fill="#C9D6E8" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" textLength="790" lengthAdjust="spacingAndGlyphs">Runs in your cloud for full runtime speed, while PII and PIFI stay</text>
    <text x="0" y="294" fill="#C9D6E8" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" textLength="640" lengthAdjust="spacingAndGlyphs">in your environment instead of being sent to ours.</text>

    <g transform="translate(0 320)">
      <rect x="0.5" y="0.5" width="228" height="46" rx="23" fill="#122034" stroke="url(#banner-chip-stroke)"/>
      <circle cx="24" cy="23" r="6" fill="#46B69F"/>
      <text x="40" y="29" fill="#EDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Visit zorka.com</text>
    </g>
  </g>
</svg>
